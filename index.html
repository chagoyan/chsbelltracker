<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1C1C">
<title>CHS Bell — Coalinga High</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top bar: day picker + alarm toggle -->
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="CHS Technology Pathway logo" class="brand-logo" id="brandLogo">
      <span class="brand-mark">CHS</span>
      <span class="brand-sub">Bell&nbsp;Tracker</span>
    </div>
    <button id="alarmToggle" class="alarm-toggle" aria-pressed="true">
      <span class="alarm-dot"></span>
      <span class="alarm-label">Alarm ON</span>
    </button>
  </header>

  <!-- Test mode: tap the logo 5 times. Runs today's schedule at 60× so the
       whole day (alarms and chimes included) can be checked outside school hours. -->
  <div id="testBar" class="test-bar" hidden>
    <div class="test-status" id="testStatus"></div>
    <button id="testRun" class="test-button">Start</button>
    <button id="testClose" class="test-button">Close</button>
  </div>

  <!-- Shown until the page is allowed to play sound (any tap turns it on) -->
  <button id="soundBanner" class="sound-banner" hidden>Sound is off. Tap here to turn on alarms.</button>

  <!-- Mode tabs: live tracker vs. read-only schedule reference -->
  <nav class="tabs" role="tablist">
    <button id="tabToday" class="tab" role="tab" aria-selected="true" aria-controls="todayView">Today</button>
    <button id="tabBrowse" class="tab" role="tab" aria-selected="false" aria-controls="browseView">View Schedules</button>
  </nav>

  <div id="todayView" role="tabpanel" aria-labelledby="tabToday">

  <!-- Schedule picker -->
  <section class="picker">
    <label for="scheduleSelect" class="picker-label">Today's schedule</label>
    <select id="scheduleSelect" class="picker-select">
      <!-- populated by app.js -->
    </select>
    <div class="picker-toggles">
      <button id="chimeToggle" class="alarm-toggle" aria-pressed="true">
        <span class="alarm-dot"></span>
        <span class="alarm-label">P2 chime</span>
      </button>
      <button id="wakeToggle" class="alarm-toggle" aria-pressed="false">
        <span class="alarm-dot"></span>
        <span class="alarm-label">Keep screen on</span>
      </button>
    </div>
  </section>

  <!-- Now / Next readout — the signature element -->
  <section class="now-panel" id="nowPanel">
    <div class="now-row">
      <div class="now-block">
        <div class="now-eyebrow">Right now</div>
        <div class="now-value" id="currentPeriodName">—</div>
        <div class="now-sub" id="currentPeriodTime">Pick a schedule above</div>
        <div class="now-elapsed" id="currentPeriodElapsed" hidden></div>
        <div class="now-phase" id="currentPhase" hidden>
          <div class="now-phase-name" id="currentPhaseName"></div>
          <div class="now-phase-next" id="currentPhaseNext"></div>
        </div>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="now-block">
        <div class="now-eyebrow">Next bell in</div>
        <div class="now-value countdown" id="countdown">--:--</div>
        <div class="now-sub" id="nextBellName">—</div>
      </div>
    </div>
  </section>

  <!-- Full period list -->
  <section class="period-list" id="periodList" aria-live="polite">
    <!-- populated by app.js -->
  </section>

  </div>

  <!-- Schedule reference — browsing here never changes today's schedule or alarms -->
  <div id="browseView" role="tabpanel" aria-labelledby="tabBrowse" hidden>
    <div class="browse-chips" id="browseChips">
      <!-- populated by app.js -->
    </div>
    <div class="browse-title" id="browseTitle"></div>
    <section class="period-list" id="browseList">
      <!-- populated by app.js -->
    </section>
  </div>

  <p class="footnote">Cleanup alarm sounds 2 minutes before each bell. The P2 chime sounds when breakfast and reading end. Keep this app open and unmuted.</p>

  <script src="app.js"></script>
</body>
</html>
